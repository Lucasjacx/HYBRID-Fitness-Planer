<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYBRID AI | Performance, Endurance & Athleten-Pitstop</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#09090b',
              card: '#121215',
              border: '#27272a',
              green: '#a3e635',
              greenHover: '#84cc16',
              greenGlow: 'rgba(163, 230, 53, 0.15)',
              muted: '#a1a1aa'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }

  <style>
    body { background-color: #09090b; color: #f4f4f5; }
    .glow-effect { box-shadow: 0 0 25px -5px rgba(163, 230, 53, 0.2); }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a3e635; }

    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8) sepia(1) saturate(5) hue-rotate(45deg);
      cursor: pointer;
    }
    
    .muscle-group {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .muscle-group:hover {
      filter: brightness(1.3);
      stroke: #ffffff;
      stroke-width: 0.5px;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-green selection:text-black">

  <!-- NAVIGATION BAR -->
  <header class="border-b border-brand-border bg-brand-black/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('generator')">
        <div class="w-9 h-9 rounded-xl bg-brand-green flex items-center justify-center text-black font-black text-xl tracking-tighter">
          H
        </div>
        <span class="font-black text-xl tracking-wider text-white">HYBRID<span class="text-brand-green">AI</span></span>
      </div>

      <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-brand-muted">
        <button onclick="switchTab('generator')" id="nav-generator" class="text-brand-green flex items-center gap-2 hover:text-white transition">
          <i class="fa-solid fa-sliders"></i> <span id="txt-nav-planer">Planer</span>
        </button>
        <button onclick="switchTab('schedule')" id="nav-schedule" class="flex items-center gap-2 hover:text-white transition">
          <i class="fa-solid fa-calendar-days"></i> <span id="txt-nav-schedule">Tagesplaner & Erholung</span>
        </button>
        <button onclick="switchTab('community')" id="nav-community" class="flex items-center gap-2 hover:text-white transition">
          <i class="fa-solid fa-gauge-high text-brand-green"></i> <span id="txt-nav-community">Athleten-Pitstop</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="flex items-center gap-2 hover:text-white transition">
          <i class="fa-solid fa-user text-brand-green"></i> <span id="txt-nav-profile">Profil</span>
        </button>
        <button onclick="switchTab('pro')" id="nav-pro" class="flex items-center gap-2 hover:text-white transition">
          <i class="fa-solid fa-bolt text-brand-green"></i> <span id="txt-nav-pro">Pro Abo</span>
        </button>
      </nav>

      <div class="flex items-center gap-3">
        <!-- SPRACHAUSWAHL DROPDOWN -->
        <select id="language-select" onchange="changeLanguage(this.value)" class="bg-brand-black border border-brand-border text-white text-xs font-bold rounded-lg px-2.5 py-2 focus:outline-none focus:border-brand-green cursor-pointer">
          <option value="de">DE</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
          <option value="pt">PT</option>
          <option value="it">IT</option>
        </select>

        <button onclick="switchTab('pro')" class="px-4 py-2 bg-brand-green hover:bg-brand-greenHover text-black text-xs font-extrabold uppercase tracking-wider rounded-lg transition glow-effect">
          Pro Upgrade
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-8">

    <!-- TAB 1: GENERATOR MIT WETTKAMPF-PLANUNG -->
    <section id="tab-generator" class="space-y-8">
      
      <div class="text-center max-w-2xl mx-auto space-y-3">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-green/10 border border-brand-green/20 text-brand-green text-xs font-bold uppercase tracking-wider">
          <i class="fa-solid fa-trophy"></i> Periodisierung & Macro-Planning
        </div>
        <h1 id="hero-title" class="text-3xl md:text-5xl font-black text-white tracking-tight">
          Dein Training. Deine Zeiten.<br><span class="text-brand-green">Maximale Performance.</span>
        </h1>
        <p id="hero-desc" class="text-brand-muted text-sm md:text-base">
          Verbinde Kraftaufbau und Ausdauer in einem klaren Wochenraster. Passe die Trainingszeit flexibel an deinen Tagesablauf an.
        </p>
      </div>

      <!-- TRAILER VIDEO -->
      <div class="max-w-3xl mx-auto rounded-2xl overflow-hidden border border-brand-border shadow-2xl glow-effect">
        <video autoplay loop muted playsinline class="w-full h-auto max-h-[300px] object-cover">
          <source src="HYBRID TRAINING VID.mp4" type="video/mp4">
          Dein Browser unterstützt kein Video.
        </video>
      </div>

      <!-- FORMULAR CARD -->
      <div class="bg-brand-card border border-brand-border rounded-2xl p-6 md:p-8 max-w-3xl mx-auto space-y-6 shadow-2xl">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label id="lbl-race-date" class="text-xs font-bold uppercase tracking-wider text-brand-muted block"><i class="fa-solid fa-flag-checkered text-brand-green"></i> 1. Wettkampf-Datum (Tag A)</label>
            <input type="date" id="race-date" onchange="calculatePhases()" class="w-full bg-brand-black border border-brand-border text-white text-sm rounded-xl p-3 focus:outline-none focus:border-brand-green transition">
          </div>

          <div class="space-y-2">
            <label id="lbl-goal" class="text-xs font-bold uppercase tracking-wider text-brand-muted block">2. Event-Typ</label>
            <select id="goal" class="w-full bg-brand-black border border-brand-border text-white text-sm rounded-xl p-3 focus:outline-none focus:border-brand-green transition">
              <option value="Ironman 70.3 / Triathlon">Ironman 70.3 / Mitteldistanz</option>
              <option value="Ironman Full">Ironman Langdistanz</option>
              <option value="Marathon">Marathon / Halbmarathon</option>
              <option value="Hybrid Race">HYROX / Hybrid-Wettkampf</option>
            </select>
          </div>
        </div>

        <div id="phase-preview" class="bg-brand-black p-4 rounded-xl border border-brand-border space-y-3 hidden">
          <span class="text-xs font-bold uppercase text-brand-green tracking-wider block"><i class="fa-solid fa-timeline"></i> Berechnete Macro-Phasen</span>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
            <div class="p-2 bg-zinc-900 rounded-lg border border-zinc-800">
              <span class="text-brand-muted block text-[10px]">PHASE 1</span>
              <strong class="text-white block" id="txt-phase-base">Grundlage (Base)</strong>
              <span id="p1-weeks" class="text-brand-green text-[10px]">-- Wochen</span>
            </div>
            <div class="p-2 bg-zinc-900 rounded-lg border border-zinc-800">
              <span class="text-brand-muted block text-[10px]">PHASE 2</span>
              <strong class="text-white block" id="txt-phase-build">Aufbau (Build)</strong>
              <span id="p2-weeks" class="text-brand-green text-[10px]">-- Wochen</span>
            </div>
            <div class="p-2 bg-zinc-900 rounded-lg border border-zinc-800">
              <span class="text-brand-muted block text-[10px]">PHASE 3</span>
              <strong class="text-white block" id="txt-phase-peak">Peak & Deload</strong>
              <span id="p3-weeks" class="text-brand-green text-[10px]">-- Wochen</span>
            </div>
            <div class="p-2 bg-zinc-900 rounded-lg border border-zinc-800">
              <span class="text-brand-muted block text-[10px]">PHASE 4</span>
              <strong class="text-white block" id="txt-phase-taper">Tapering (Abbau)</strong>
              <span id="p4-weeks" class="text-brand-green text-[10px]">2 Wochen</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-2">
            <label id="lbl-sessions" class="text-xs font-bold uppercase tracking-wider text-brand-muted block">3. Einheiten pro Woche</label>
            <select id="days" class="w-full bg-brand-black border border-brand-border text-white text-sm rounded-xl p-3 focus:outline-none focus:border-brand-green transition">
              <option value="4 Tage">4 Einheiten (Vollbeschäftigt)</option>
              <option value="5 Tage" selected>5 Einheiten (Standard Hybrid)</option>
              <option value="6 Tage">6 Einheiten (Performance Focus)</option>
            </select>
          </div>

          <div class="space-y-2">
            <label id="lbl-endurance" class="text-xs font-bold uppercase tracking-wider text-brand-muted block">4. Fokus-Ausdauer</label>
            <select id="endurance" class="w-full bg-brand-black border border-brand-border text-white text-sm rounded-xl p-3 focus:outline-none focus:border-brand-green transition">
              <option value="Triathlon">Triathlon (Schwimmen, Velo, Laufen)</option>
              <option value="Duathlon">Duathlon (Velo, Laufen)</option>
              <option value="Laufen">Laufen + Kraft</option>
            </select>
          </div>
        </div>

        <button onclick="generatePlan()" id="btn-generate" class="w-full py-4 bg-brand-green hover:bg-brand-greenHover text-black font-black uppercase tracking-wider rounded-xl transition glow-effect flex items-center justify-center gap-3">
          <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
          <span>Plan Erstellen & In Den Kalender Schieben</span>
        </button>

      </div>
    </section>

    <!-- TAB 2: TAGESPLANER & DETAILLIERTE MUSKEL-ANATOMIE -->
    <section id="tab-schedule" class="hidden space-y-6">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-brand-card p-6 rounded-2xl border border-brand-border">
        <div>
          <h2 id="txt-schedule-title" class="text-2xl font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-calendar-day text-brand-green"></i> Wochen- & Tagesablauf
          </h2>
          <p id="txt-schedule-subtitle" class="text-xs text-brand-muted mt-1">Klicke auf ein Training, um Details zu öffnen, Übungen anzupassen, Zeit automatisch zu berechnen und Sätze zu tracken.</p>
        </div>
      </div>

      <!-- DETAILLIERTE ANATOMIE MUSKEL-MAP -->
      <div class="bg-brand-card border border-brand-border rounded-2xl p-6 space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-brand-border pb-4">
          <div>
            <h3 id="txt-anatomy-title" class="text-xl font-black text-white flex items-center gap-2">
              <i class="fa-solid fa-child text-brand-green"></i> Präzisions-Muskelstatus & Interferenz
            </h3>
            <p id="txt-anatomy-subtitle" class="text-xs text-brand-muted mt-1">Detaillierte Erholungsberechnung für spezifische Muskelgruppen.</p>
          </div>

          <div class="flex items-center gap-4 text-xs font-bold">
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> 0-24h (Ermüdet)</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span> 24-48h (Erholung)</span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-brand-green inline-block"></span> 48h+ (Bereit)</span>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
          
          <div class="lg:col-span-1 bg-brand-black p-4 rounded-xl border border-brand-border flex justify-center items-center gap-6">
            
            <!-- VORDERSEITE -->
            <div class="text-center space-y-2">
              <span id="txt-front" class="text-[10px] uppercase font-bold text-brand-muted tracking-wider">Vorderseite</span>
              <svg viewBox="0 0 100 200" class="w-32 h-64">
                <path class="muscle-group" d="M 36 42 Q 50 39 64 42 L 62 58 Q 50 62 38 58 Z" fill="#a3e635" title="Brust"/>
                <path class="muscle-group" d="M 24 42 Q 34 38 34 48 L 26 60 Z M 76 42 Q 66 38 66 48 L 74 60 Z" fill="#a3e635" title="Schultern"/>
                <path class="muscle-group" d="M 25 62 L 32 62 L 30 80 L 23 78 Z M 75 62 L 68 62 L 70 80 L 77 78 Z" fill="#a3e635" title="Bizeps"/>
                <path class="muscle-group" d="M 40 64 Q 50 66 60 64 L 58 74 Q 50 76 42 74 Z" fill="#a3e635"/>
                <path class="muscle-group" d="M 41 76 Q 50 78 59 76 L 57 86 Q 50 88 43 86 Z" fill="#a3e635"/>
                <path class="muscle-group" d="M 34 98 Q 48 95 48 140 L 36 138 Z" fill="#ef4444" title="Quads"/>
                <path class="muscle-group" d="M 52 95 Q 66 98 64 138 L 52 140 Z" fill="#ef4444" title="Quads"/>
                <path class="muscle-group" d="M 37 144 L 42 185 L 35 185 Z M 63 144 L 58 185 L 65 185 Z" fill="#eab308" title="Schienbein"/>
              </svg>
            </div>

            <!-- RÜCKSEITE -->
            <div class="text-center space-y-2">
              <span id="txt-back" class="text-[10px] uppercase font-bold text-brand-muted tracking-wider">Rückseite</span>
              <svg viewBox="0 0 100 200" class="w-32 h-64">
                <path class="muscle-group" d="M 38 35 Q 50 30 62 35 L 66 46 Q 50 42 34 46 Z" fill="#a3e635" title="Trapez"/>
                <path class="muscle-group" d="M 32 48 Q 50 44 68 48 L 60 76 Q 50 80 40 76 Z" fill="#a3e635" title="Latissimus"/>
                <path class="muscle-group" d="M 23 60 L 30 60 L 28 80 L 21 78 Z M 77 60 L 70 60 L 72 80 L 79 78 Z" fill="#a3e635" title="Trizeps"/>
                <path class="muscle-group" d="M 42 78 Q 50 80 58 78 L 56 94 Q 50 96 44 94 Z" fill="#a3e635"/>
                <path class="muscle-group" d="M 34 96 Q 50 90 66 96 L 64 118 Q 50 122 36 118 Z" fill="#eab308" title="Gluteus"/>
                <path class="muscle-group" d="M 36 122 Q 48 120 48 152 L 38 150 Z" fill="#ef4444" title="Hamstrings"/>
                <path class="muscle-group" d="M 52 120 Q 64 122 62 150 L 52 152 Z" fill="#ef4444" title="Hamstrings"/>
                <path class="muscle-group" d="M 37 155 L 43 186 L 35 186 Z M 63 155 L 57 186 L 65 186 Z" fill="#eab308" title="Waden"/>
              </svg>
            </div>

          </div>

          <div class="lg:col-span-2 space-y-4">
            <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-start gap-3">
              <i class="fa-solid fa-triangle-exclamation text-red-400 text-lg mt-0.5"></i>
              <div class="space-y-1">
                <h4 id="txt-interference-title" class="text-sm font-bold text-red-400">Interferenz-Warnung: Beine & Quads (18% Erholt)</h4>
                <p id="txt-interference-desc" class="text-xs text-zinc-300">
                  Die Oberschenkel-Vorderseite (Quads) weist hohe mikroskopische Gewebeschäden auf. Heute kein Lauf mit Höhenmetern oder schweren Kniebeugen empfohlen.
                </p>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
              <div class="bg-brand-black p-3 rounded-xl border border-brand-border space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold">
                  <span class="text-white">Quads</span>
                  <span class="text-red-400">18%</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-red-500 h-full w-[18%]"></div>
                </div>
              </div>

              <div class="bg-brand-black p-3 rounded-xl border border-brand-border space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold">
                  <span class="text-white">Hamstrings</span>
                  <span class="text-red-400">25%</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-red-500 h-full w-[25%]"></div>
                </div>
              </div>

              <div class="bg-brand-black p-3 rounded-xl border border-brand-border space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold">
                  <span class="text-white">Gluteus</span>
                  <span class="text-yellow-400">55%</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-yellow-400 h-full w-[55%]"></div>
                </div>
              </div>

              <div class="bg-brand-black p-3 rounded-xl border border-brand-border space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold">
                  <span class="text-white">Waden / Calves</span>
                  <span class="text-yellow-400">60%</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-yellow-400 h-full w-[60%]"></div>
                </div>
              </div>

              <div class="bg-brand-black p-3 rounded-xl border border-brand-border space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold">
                  <span class="text-white">Brust / Chest</span>
                  <span class="text-brand-green">100%</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-brand-green h-full w-full"></div>
                </div>
              </div>

              <div class="bg-brand-black p-3 rounded-xl border border-brand-border space-y-1">
                <div class="flex items-center justify-between text-[11px] font-bold">
                  <span class="text-white">Rücken / Back</span>
                  <span class="text-brand-green">100%</span>
                </div>
                <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-brand-green h-full w-full"></div>
                </div>
              </div>
            </div>

          </div>

        </div>
      </div>

      <div id="workout-list" class="space-y-4"></div>

    </section>

    <!-- TAB 3: ATHLETEN-PITSTOP / COMMUNITY FEED WITH PHOTO UPLOADS -->
    <section id="tab-community" class="hidden space-y-8 max-w-4xl mx-auto">
      
      <div class="text-center max-w-xl mx-auto space-y-2">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-green/10 border border-brand-green/20 text-brand-green text-xs font-bold uppercase tracking-wider">
          <i class="fa-solid fa-gauge-high"></i> <span id="lbl-pitstop-badge">Athleten-Pitstop</span>
        </div>
        <h2 id="lbl-pitstop-title" class="text-3xl font-black text-white">Athleten-Pitstop Feed</h2>
        <p id="txt-community-sub" class="text-brand-muted text-xs">Tausche dich mit anderen Athleten über Workouts, Zeiten, Fotos & Wettkampf-Erfahrungen aus.</p>
      </div>

      <!-- BEITRAG ERSTELLEN BOX MIT BILD-UPLOAD -->
      <div class="bg-brand-card border border-brand-border rounded-2xl p-5 space-y-4 shadow-xl">
        <div class="flex flex-wrap items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-brand-green flex items-center justify-center text-black font-extrabold text-sm">
            DU
          </div>
          <input type="text" id="post-author" placeholder="Dein Name" value="Lucas" class="bg-brand-black border border-brand-border text-white text-xs rounded-xl p-2.5 focus:outline-none focus:border-brand-green w-48">
          <select id="post-category" class="bg-brand-black border border-brand-border text-white text-xs rounded-xl p-2.5 focus:outline-none focus:border-brand-green flex-1">
            <option value="Ironman 70.3">Ironman 70.3 Training</option>
            <option value="Lauf-Session">Lauf-Session / Pace</option>
            <option value="Kraft / Gym">Kraft / Gym Session</option>
            <option value="Wettkampf-Tipp">Wettkampf-Tipp / Talk</option>
          </select>
        </div>

        <textarea id="post-content" rows="3" placeholder="Was hast du heute trainiert? Lade ein Foto hoch oder teile deine Zeiten im Pitstop..." class="w-full bg-brand-black border border-brand-border text-white text-xs rounded-xl p-3 focus:outline-none focus:border-brand-green resize-none placeholder:text-zinc-600"></textarea>

        <!-- BILD-ATTACHMENT FORMULAR -->
        <div class="space-y-2 bg-brand-black/60 p-3 rounded-xl border border-brand-border">
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <label for="post-image-file" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-brand-green border border-brand-border rounded-xl text-xs font-bold cursor-pointer transition flex items-center gap-2">
                <i class="fa-solid fa-camera"></i> <span id="lbl-upload-photo">Foto hochladen</span>
              </label>
              <input type="file" id="post-image-file" accept="image/*" onchange="handleImageSelect(event)" class="hidden">
              <span id="file-name-display" class="text-[11px] text-brand-muted truncate max-w-[150px]">Kein Bild gewählt</span>
            </div>

            <div class="flex items-center gap-2">
              <span class="text-[10px] text-zinc-500 font-bold uppercase">oder Bild-URL:</span>
              <input type="text" id="post-image-url" placeholder="https://..." onchange="handleUrlInput(this.value)" class="bg-brand-black border border-brand-border text-white text-xs rounded-lg p-1.5 focus:outline-none focus:border-brand-green w-40">
            </div>
          </div>

          <!-- IMAGE PREVIEW -->
          <div id="image-preview-container" class="relative hidden mt-2">
            <img id="image-preview" src="" alt="Vorschau" class="max-h-48 rounded-xl border border-brand-border object-cover w-full">
            <button onclick="removeSelectedImage()" class="absolute top-2 right-2 w-7 h-7 bg-black/80 hover:bg-red-600 text-white rounded-full flex items-center justify-center text-xs transition">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div class="flex justify-between items-center pt-1">

    function calculatePhases() {
      const dateInput = document.getElementById('race-date').value;
      if (!dateInput) return;

      const raceDate = new Date(dateInput);
      const today = new Date();
      const diffTime = raceDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      const totalWeeks = Math.floor(diffDays / 7);

      if (totalWeeks < 2) {
        alert("Das Datum liegt zu nah in der Zukunft! Wähle ein Datum mit mindestens 4 Wochen Vorlaufzeit.");
        return;
      }

      const taperWeeks = 2;
      const remainingWeeks = totalWeeks - taperWeeks;
      const baseWeeks = Math.floor(remainingWeeks * 0.5);
      const buildWeeks = Math.floor(remainingWeeks * 0.3);
      const peakWeeks = remainingWeeks - baseWeeks - buildWeeks;

      document.getElementById('p1-weeks').innerText = `${baseWeeks} Wochen`;
      document.getElementById('p2-weeks').innerText = `${buildWeeks} Wochen`;
      document.getElementById('p3-weeks').innerText = `${peakWeeks} Wochen`;

      document.getElementById('phase-preview').classList.remove('hidden');
    }

    function getEndTime(startTimeStr, durationMinutes) {
      if(!startTimeStr || durationMinutes === 0) return startTimeStr;
      const [hours, mins] = startTimeStr.split(':').map(Number);
      const startDate = new Date();
      startDate.setHours(hours, mins, 0);
      const endDate = new Date(startDate.getTime() + durationMinutes * 60000);
      const endHours = String(endDate.getHours()).padStart(2, '0');
      const endMins = String(endDate.getMinutes()).padStart(2, '0');
      return `${endHours}:${endMins}`;
    }

    function autoCalculateDuration(workout) {
      if (!workout.exercises || workout.exercises.length === 0) {
        workout.duration = 15;
        return;
      }
      let totalMinutes = 10;
      workout.exercises.forEach(ex => {
        const setsCount = ex.sets || (ex.loggedSets ? ex.loggedSets.length : 3);
        totalMinutes += setsCount * 3;
      });
      workout.duration = Math.max(20, totalMinutes);
    }

    function toggleTimer(forceStart = false) {
      const btn = document.getElementById('btn-timer-toggle');
      if (timerRunning && !forceStart) {
        clearInterval(timerInterval);
        timerRunning = false;
        btn.innerText = 'Start';
        btn.className = 'px-3 py-1.5 bg-brand-green hover:bg-brand-greenHover text-black text-xs font-extrabold rounded-lg transition';
      } else {
        if (timerInterval) clearInterval(timerInterval);
        timerRunning = true;
        btn.innerText = 'Pause';
        btn.className = 'px-3 py-1.5 bg-yellow-400 hover:bg-yellow-500 text-black text-xs font-extrabold rounded-lg transition';

        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            btn.innerText = 'Start';
            btn.className = 'px-3 py-1.5 bg-brand-green hover:bg-brand-greenHover text-black text-xs font-extrabold rounded-lg transition';
            alert('⏱️ Satz-Pause beendet! Bereit für den nächsten Satz.');
          }
        }, 1000);
      }
    }

    function resetTimer(seconds) {
      if (timerInterval) clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = seconds;
      updateTimerDisplay();
      const btn = document.getElementById('btn-timer-toggle');
      btn.innerText = 'Start';
      btn.className = 'px-3 py-1.5 bg-brand-green hover:bg-brand-greenHover text-black text-xs font-extrabold rounded-lg transition';

      const container = document.getElementById('profile-posts-container');
      container.innerHTML = '';

      const myPosts = communityPosts.filter(p => p.author === 'Lucas' || p.author === 'Lucas Vance');

      if (myPosts.length === 0) {
        container.innerHTML = `
          <div class="text-center py-6 text-brand-muted text-xs bg-brand-black p-4 rounded-xl border border-brand-border">
            Du hast noch keine eigenen Posts im Athleten-Pitstop geteilt.
          </div>
        `;
        return;
      }

      myPosts.forEach(post => {
        const postCard = document.createElement('div');
        postCard.className = 'bg-brand-black border border-brand-border rounded-xl p-4 space-y-3';

        const imageHtml = post.image ? `
          <div class="rounded-lg overflow-hidden border border-brand-border max-h-48 bg-black">
            <img src="${post.image}" alt="Post Image" class="w-full h-full object-cover max-h-48">
          </div>
        ` : '';

        postCard.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[10px] text-brand-muted">${post.time}</span>
            <span class="px-2 py-0.5 bg-brand-green/10 text-brand-green rounded text-[10px] font-bold uppercase">${post.category}</span>
          </div>
          <p class="text-xs text-zinc-200">${post.content}</p>
          ${imageHtml}
          <div class="flex items-center gap-4 text-xs text-brand-muted pt-1">
            <span><i class="fa-solid fa-thumbs-up text-brand-green"></i> ${post.kudos} Kudos</span>
            <span><i class="fa-regular fa-comment"></i> ${post.comments.length} Kommentare</span>
          </div>
        `;

        container.appendChild(postCard);
      });
    }

    function addCommunityPost() {
      const author = document.getElementById('post-author').value || 'Lucas Vance';
      const category = document.getElementById('post-category').value;
      const content = document.getElementById('post-content').value;

      if (!content.trim() && !currentSelectedImage) {
        alert("Bitte gib einen Text oder ein Foto ein!");
        return;
      }

      communityPosts.unshift({
        id: Date.now(),
        author: author,
        category: category,
        time: 'Gerade eben',
        content: content,
        image: currentSelectedImage,
        kudos: 0,
        comments: []
      });

      document.getElementById('post-content').value = '';
      removeSelectedImage();
      renderCommunityFeed();
      renderProfilePosts();
    }

    function giveKudos(index) {
      communityPosts[index].kudos += 1;
      renderCommunityFeed();
      renderProfilePosts();
    }

    function addComment(index) {
      const input = document.getElementById(`comment-input-${index}`);
      if (!input.value.trim()) return;

      communityPosts[index].comments.push({
        author: 'Lucas Vance',
        text: input.value
      });

      renderCommunityFeed();
      renderProfilePosts();
    }

    function exportGoogleCalendar(index) {
      const w = currentWorkouts[index];
      const endTime = getEndTime(w.startTime, w.duration);
      const now = new Date();
      const dateStr = now.toISOString().replace(/-|:|\.\d\d\d/g, "").substring(0, 8);
      const startIso = `${dateStr}T${w.startTime.replace(':', '')}00`;
      const endIso = `${dateStr}T${endTime.replace(':', '')}00`;
      const title = encodeURIComponent(`[HYBRID AI] ${w.title}`);
      const details = encodeURIComponent(`${w.desc}\n\nDauer: ${w.duration} Min`);
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startIso}/${endIso}&details=${details}`;
      window.open(url, '_blank');
    }

    function exportSingleIcs(index) {
      const w = currentWorkouts[index];
      const endTime = getEndTime(w.startTime, w.duration);
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const dtStart = `${year}${month}${day}T${w.startTime.replace(':', '')}00`;
      const dtEnd = `${year}${month}${day}T${endTime.replace(':', '')}00`;

      const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//HYBRID AI Fitness//DE\nBEGIN:VEVENT\nSUMMARY:[HYBRID AI] ${w.title}\nDESCRIPTION:${w.desc}\nDTSTART:${dtStart}\nDTEND:${dtEnd}\nEND:VEVENT\nEND:VCALENDAR`;
      downloadFile(icsContent, `training-${w.rawDay.toLowerCase()}.ics`, 'text/calendar');
    }

    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function generatePlan() {
      const btn = document.getElementById('btn-generate');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Erstelle Wettkampfplan...`;

      setTimeout(() => {
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-lg"></i> <span>Wettkampf-Plan Generieren & Kalender Synchronisieren</span>`;
        switchTab('schedule');
      }, 800);
    }

    window.onload = function() {
      changeLanguage('de');
    };
  </script>
</body>
</html>
